; ============================================================================
; ESP32-S3 Tabletop Voice Robot — PlatformIO Configuration
; Target: ESP32-S3-WROOM-1-N16R8 (16MB Quad Flash + 8MB Octal PSRAM)
; Toolchain pinned to espressif32 @ 6.9.0 (Arduino-ESP32 v2.0.17 legacy I2S)
; ============================================================================

[platformio]
default_envs = gate1_board

[env]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
; NOTE: 16MB + default_16MB.csv is for ESP32-S3-WROOM-1-N16R8.
; If using an N8R8 (8MB Flash + 8MB Octal PSRAM), change these two lines to:
;   board_upload.flash_size = 8MB
;   board_build.partitions = default_8MB.csv
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
extra_scripts = pre:scripts/load_secrets_inc.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    bblanchon/ArduinoJson @ ^7.2.0

; --- Isolated Per-Gate Hardware Bring-Up Environments ---

[env:gate1_board]
build_src_filter = +<gate1_board/>

[env:gate2_display]
build_src_filter = +<gate2_display/>

[env:gate3_mic]
build_src_filter = +<gate3_mic/>

[env:gate4_speaker]
build_src_filter = +<gate4_speaker/>

[env:gate5_loopback]
build_src_filter = +<gate5_loopback/>

[env:gate6_health]
build_src_filter = +<gate6_health/>

[env:gate7_echo]
build_src_filter = +<gate7_echo/>

[env:robot_main]
build_src_filter = +<robot_main/>
